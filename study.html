<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>学習中 - TechTrain → Claude</title>
<link rel="icon" href="icons/32.png">
<style>
  :root {
    --bg: #faf8f3; --card: #ffffff; --ink: #2b2a27; --sub: #77726a; --line: #ebe6dc;
    --accent: #d97757; --accent-soft: #f6e3da; --good: #3f9b6c;
    --basic: #5b8def; --applied: #d9a03c; --quiz: #4caf7d;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1f1e1c; --card: #2a2926; --ink: #f1ede4; --sub: #a49e92; --line: #3a3834; --accent-soft: #4a3329; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.6 "Hiragino Sans", "Yu Gothic UI", "Noto Sans JP", system-ui, sans-serif; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 40px 16px 60px; }
  .brand { font-weight: 700; font-size: 14px; color: var(--sub); margin-bottom: 18px; }
  .brand span { color: var(--accent); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 22px; margin-bottom: 14px; }
  .chip { display: inline-block; padding: 1px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; color: #fff; }
  .chip.basic { background: var(--basic); } .chip.applied { background: var(--applied); } .chip.quiz { background: var(--quiz); }
  .kinds { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
  .kbtn { border: 1.5px solid var(--line); background: var(--card); color: var(--sub); border-radius: 999px; padding: 2px 11px; font: inherit; font-size: 12px; font-weight: 700; cursor: pointer; }
  .kbtn.on { color: #fff; }
  .kbtn.on[data-k=basic] { background: var(--basic); border-color: var(--basic); }
  .kbtn.on[data-k=applied] { background: var(--applied); border-color: var(--applied); }
  .kbtn.on[data-k=quiz] { background: var(--quiz); border-color: var(--quiz); }
  .kguess { color: var(--sub); font-size: 12px; }
  h1 { font-size: 22px; line-height: 1.4; margin: 10px 0 6px; word-break: break-word; }
  .meta { color: var(--sub); font-size: 13px; }
  .acts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
  .btn { background: var(--card); border: 1px solid var(--line); color: var(--ink); border-radius: 9px; padding: 9px 14px; font: inherit; font-size: 14px; cursor: pointer; }
  .btn:hover { border-color: var(--accent); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 700; }
  .btn.primary:disabled { opacity: .45; cursor: not-allowed; }
  .hint { color: var(--sub); font-size: 12.5px; margin-top: 10px; }
  h2 { font-size: 16px; margin: 0 0 4px; }
  .rates { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 14px 0; }
  .rate { background: var(--card); border: 1.5px solid var(--line); border-radius: 12px; padding: 10px 4px; cursor: pointer; font: inherit; color: var(--ink); text-align: center; }
  .rate b { display: block; font-size: 26px; line-height: 1.2; }
  .rate span { font-size: 13px; }
  .rate.on { border-color: var(--accent); background: var(--accent-soft); }
  textarea { width: 100%; min-height: 88px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--ink); font: inherit; resize: vertical; }
  textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .row { display: flex; align-items: center; justify-content: space-between; margin-top: 12px; gap: 10px; }
  .count { color: var(--sub); font-size: 12.5px; }
  .link { background: none; border: 0; color: var(--sub); text-decoration: underline; cursor: pointer; font: inherit; font-size: 13px; padding: 0; }
  .done { text-align: center; }
  .done .big { font-size: 44px; font-weight: 800; line-height: 1.1; margin: 6px 0; }
  .done .big small { font-size: 18px; }
  .bar { height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; margin: 8px auto 0; max-width: 260px; }
  .bar i { display: block; height: 100%; background: var(--good); border-radius: 4px; }
  .memo { background: var(--bg); border-radius: 10px; padding: 10px 12px; margin-top: 12px; text-align: left; white-space: pre-wrap; word-break: break-word; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">TechTrain <span>→</span> Claude</div>

  <div class="card" id="missing" hidden>
    <h2>この学習の記録が見つかりませんでした</h2>
    <p class="meta">削除されたか、記録を消した可能性があります。</p>
  </div>

  <div id="main" hidden>
    <div class="card">
      <div class="kinds" id="kinds">
        <button class="kbtn" data-k="basic">基礎知識</button>
        <button class="kbtn" data-k="applied">応用知識</button>
        <button class="kbtn" data-k="quiz">クイズ</button>
        <span class="kguess" id="kguess" hidden>違っていたら押して直せます</span>
      </div>
      <h1 id="topic"></h1>
      <div class="meta" id="meta"></div>
      <div class="acts">
        <button class="btn primary" id="openApp">Claudeアプリで開く</button>
        <button class="btn" id="openWeb">ブラウザで開く</button>
        <button class="btn" id="copy">プロンプトをコピー</button>
      </div>
      <div class="hint" id="launchHint" hidden>
        Chromeに「Claude を開きますか？」と出たら、「常に許可」にチェックを入れて開くと次回から出なくなります。アプリが開かないときは「Claudeアプリで開く」を押してください。
      </div>
    </div>

    <div class="card" id="reflect">
      <h2 id="reflectTitle">学習が終わったら、振り返って記録しよう</h2>
      <div class="meta">ここまでやると「学習した日」として連続記録と今週の目標に数えられます。</div>
      <div class="rates" id="rates">
        <button class="rate" data-r="3"><b>😆</b><span>バッチリ</span></button>
        <button class="rate" data-r="2"><b>🙂</b><span>だいたい</span></button>
        <button class="rate" data-r="1"><b>🤔</b><span>もう一回</span></button>
      </div>
      <textarea id="memo" placeholder="今日わかったことを、自分の言葉で一言"></textarea>
      <div class="row">
        <span class="count" id="count"></span>
        <button class="btn primary" id="save" disabled>記録する</button>
      </div>
      <div class="row" style="margin-top:14px">
        <span></span>
        <button class="link" id="skip">この学習は記録しない</button>
      </div>
    </div>

    <div class="card done" id="doneCard" hidden>
      <div style="font-size:34px">🔥</div>
      <div class="big"><span id="streak">0</span><small> 日連続</small></div>
      <div class="meta" id="weekText"></div>
      <div class="bar"><i id="weekBar"></i></div>
      <div class="memo" id="memoView"></div>
      <div class="acts" style="justify-content:center">
        <button class="btn" id="edit">振り返りを書き直す</button>
        <button class="btn primary" id="close">このタブを閉じる</button>
      </div>
    </div>
  </div>
</div>
<script src="lib.js"></script>
<script src="study.js"></script>
</body>
</html>
